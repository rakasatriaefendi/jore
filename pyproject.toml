[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jore"
version = "1.12.6"
description = "JORE (Yor-Eh) — a terminal-first multi-agent orchestrator for Codex and OpenCode"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Raka Satria Efendi" }
]
keywords = [
    "ai",
    "agents",
    "multi-agent",
    "orchestration",
    "cli",
    "terminal",
    "codex",
    "opencode"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows"
]

dependencies = [
    "rich>=14.3.4,<15",
    "prompt-toolkit>=3.0.53,<4"
]

[project.scripts]
jore = "agenthub.entrypoint:main"
agenthub = "agenthub.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agenthub*"]
namespaces = true

[tool.setuptools.package-data]
agenthub = [
    "assets/jore/*.json",
    "assets/jore/plain/*/*.txt"
]
